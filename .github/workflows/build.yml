name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Static XAML checks
        run: python3 build/check_xaml.py
      - name: Test
        run: dotnet test tests/Tickshift.Tests/Tickshift.Tests.csproj -c Release

  windows:
    name: Build, test and package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build, test, publish and package
        shell: pwsh
        run: ./build/publish.ps1 -Version "1.0.${{ github.run_number }}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tickshift-windows-x64
          path: artifacts/installer/*
          if-no-files-found: error
